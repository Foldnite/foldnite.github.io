<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortnite Science</title>

    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Three.js + extensions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js">
    </script>

    <style>
        /* ---------- Fortnite fonts ---------- */
        @font-face {
            font-family: 'Burbank Big Condensed';
            src: url('https://foldnite.github.io/assets/font/burbankbigcondensed_bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Burbank Big Condensed';
            src: url('https://foldnite.github.io/assets/font/burbankbigcondensed_black.otf') format('opentype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        /* ---------- Reset ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Burbank Big Condensed', sans-serif;
            background: #0b0e1a;
            color: #fff;
            overflow: hidden;
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* ---------- Animated digital grid (background) ---------- */
        #grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0, 100, 255, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 0, 200, 0.08) 0%, transparent 60%),
                linear-gradient(135deg, #0b0e1a 0%, #141b2b 50%, #0b0e1a 100%);
            overflow: hidden;
            pointer-events: none;
        }
        #grid-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image:
                linear-gradient(rgba(0, 180, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 180, 255, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            transform-origin: center center;
        }
        #grid-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image:
                linear-gradient(rgba(0, 255, 200, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 200, 0.02) 1px, transparent 1px);
            background-size: 120px 120px;
            animation: gridMove 30s linear infinite reverse;
            transform-origin: center center;
        }
        @keyframes gridMove {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(60px, 60px) rotate(0.5deg);
            }
        }

        /* ---------- 3D container (no borders, full screen) ---------- */
        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        #three-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ---------- Overlay content ---------- */
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3vh 5vw 4vh;
            pointer-events: none;
        }

        /* ---------- Title block ---------- */
        .title-block {
            text-align: center;
            margin-top: 2vh;
            pointer-events: none;
        }
        .title-block h1 {
            font-family: 'Burbank Big Condensed', sans-serif;
            font-weight: 900;
            font-size: clamp(3rem, 12vw, 7rem);
            letter-spacing: 4px;
            line-height: 0.9;
            background: linear-gradient(135deg, #00b4ff 0%, #7b2ffc 50%, #ff2d95 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(0, 180, 255, 0.15);
        }
        .title-block .sub {
            font-family: 'Burbank Big Condensed', sans-serif;
            font-weight: 700;
            font-size: clamp(1.8rem, 6vw, 3.8rem);
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            margin-top: -0.3em;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        /* ---------- Bottom sections (with beveled panels) ---------- */
        .bottom-sections {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(1.5rem, 5vw, 5rem);
            pointer-events: auto;
            margin-bottom: 2vh;
        }

        .section-group {
            flex: 0 1 auto;
            min-width: 200px;
            text-align: center;
            position: relative;
            padding: 1.2rem 2rem 1.5rem;
            background: rgba(11, 14, 26, 0.65);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(0, 180, 255, 0.12);
            /* Beveled bottom corners (Fortnite style) */
            clip-path: polygon(0% 0%, 100% 0%, 94% 100%, 6% 100%);
            transition: all 0.25s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .section-group:hover {
            background: rgba(11, 14, 26, 0.8);
            border-color: rgba(0, 180, 255, 0.25);
            transform: scale(1.02);
        }

        .section-group .label {
            font-family: 'Burbank Big Condensed', sans-serif;
            font-weight: 700;
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            margin-bottom: 0.8rem;
            display: inline-block;
            border-bottom: 2px solid rgba(0, 180, 255, 0.25);
            padding-bottom: 0.2rem;
        }

        .platform-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem 1.6rem;
        }
        .platform-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Burbank Big Condensed', sans-serif;
            font-weight: 700;
            font-size: clamp(0.9rem, 1.4vw, 1.3rem);
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1px;
            transition: color 0.2s;
            text-decoration: none;
            cursor: default;
            white-space: nowrap;
        }
        .platform-item i {
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            color: #00b4ff;
            opacity: 0.6;
            transition: opacity 0.2s, color 0.2s;
            width: 1.8rem;
            text-align: center;
        }
        .platform-item:hover {
            color: #fff;
        }
        .platform-item:hover i {
            opacity: 1;
            color: #ff2d95;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 768px) {
            .bottom-sections {
                flex-direction: column;
                align-items: center;
                gap: 1.2rem;
            }
            .section-group {
                min-width: unset;
                width: 90%;
                max-width: 400px;
                padding: 1rem 1.2rem 1.2rem;
                clip-path: polygon(0% 0%, 100% 0%, 96% 100%, 4% 100%);
            }
            .platform-list {
                gap: 0.4rem 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            .platform-item {
                font-size: 1rem;
                white-space: normal;
            }
            .content {
                padding: 2vh 4vw 2vh;
            }
        }

        @media (max-width: 480px) {
            .section-group {
                padding: 0.8rem 0.8rem 1rem;
                clip-path: polygon(0% 0%, 100% 0%, 97% 100%, 3% 100%);
            }
            .platform-item {
                font-size: 0.9rem;
                gap: 0.2rem;
            }
            .platform-item i {
                font-size: 1rem;
                width: 1.4rem;
            }
            .section-group .label {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Animated grid background -->
    <div id="grid-bg"></div>

    <!-- 3D container (no borders) -->
    <div id="three-container">
        <canvas id="three-canvas"></canvas>
    </div>

    <!-- Main content -->
    <div class="content">

        <!-- Title -->
        <div class="title-block">
            <h1>FORTNITE</h1>
            <div class="sub">SCIENCE</div>
        </div>

        <!-- Bottom sections with beveled panels -->
        <div class="bottom-sections">

            <!-- PLAY section -->
            <div class="section-group">
                <div class="label"><i class="fas fa-gamepad" style="margin-right:0.5rem;color:#ff2d95;"></i>ИГРАТЬ</div>
                <div class="platform-list">
                    <span class="platform-item"><i class="fab fa-amazon"></i> Amazon Luna</span>
                    <span class="platform-item"><i class="fab fa-xbox"></i> Xbox Cloud</span>
                    <span class="platform-item"><i class="fas fa-bolt"></i> GeForce NOW</span>
                </div>
            </div>

            <!-- DOWNLOAD ON section -->
            <div class="section-group">
                <div class="label"><i class="fas fa-download" style="margin-right:0.5rem;color:#00b4ff;"></i>ЗАГРУЗИТЬ НА</div>
                <div class="platform-list">
                    <span class="platform-item"><i class="fab fa-playstation"></i> PlayStation</span>
                    <span class="platform-item"><i class="fab fa-xbox"></i> Xbox</span>
                    <span class="platform-item"><i class="fab fa-nintendo-switch"></i> Nintendo</span>
                    <span class="platform-item"><i class="fab fa-android"></i> Android</span>
                    <span class="platform-item"><i class="fab fa-epicgames"></i> Epic Games</span>
                    <span class="platform-item"><i class="fab fa-apple"></i> iOS / iPad</span>
                    <span class="platform-item"><i class="fab fa-google-play"></i> Google Play</span>
                </div>
            </div>

        </div>
    </div>

    <!-- ============================================================ -->
    <!-- Three.js – load and display the mannequin                     -->
    <!-- ============================================================ -->
    <script>
        (function() {
            const container = document.getElementById('three-container');
            const canvas = document.getElementById('three-canvas');

            // --- Scene ---
            const scene = new THREE.Scene();
            scene.background = null; // transparent

            // --- Camera ---
            const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 1.8, 4.2);
            camera.lookAt(0, 1.2, 0);

            // --- Renderer ---
            const renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true,
                antialias: true,
            });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;

            // --- Lighting ---
            const ambient = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambient);

            const key = new THREE.DirectionalLight(0x00b4ff, 1.8);
            key.position.set(3, 5, 4);
            key.castShadow = true;
            key.shadow.mapSize.width = 1024;
            key.shadow.mapSize.height = 1024;
            scene.add(key);

            const fill = new THREE.DirectionalLight(0xff2d95, 0.8);
            fill.position.set(-3, 2, 2);
            scene.add(fill);

            const rim = new THREE.DirectionalLight(0x8af0ff, 0.6);
            rim.position.set(0, -1, -5);
            scene.add(rim);

            const back = new THREE.DirectionalLight(0x7b2ffc, 0.4);
            back.position.set(-2, 1, -4);
            scene.add(back);

            const hemi = new THREE.HemisphereLight(0x00b4ff, 0xff2d95, 0.4);
            scene.add(hemi);

            // --- Invisible ground plane for shadows ---
            const planeGeo = new THREE.PlaneGeometry(8, 8);
            const planeMat = new THREE.ShadowMaterial({
                opacity: 0.25,
                color: 0x000000,
            });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = -0.1;
            plane.receiveShadow = true;
            scene.add(plane);

            // --- Variables ---
            let mannequin = null;
            let mixer = null;
            let clock = new THREE.Clock();
            let modelLoaded = false;

            // --- Fallback figure (if GLB fails) ---
            function createFallbackMannequin() {
                const group = new THREE.Group();

                const bodyGeo = new THREE.CylinderGeometry(0.6, 0.7, 1.8, 12);
                const bodyMat = new THREE.MeshStandardMaterial({
                    color: 0x00b4ff,
                    roughness: 0.3,
                    metalness: 0.6,
                    emissive: 0x002244,
                    emissiveIntensity: 0.2,
                });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.9;
                body.castShadow = true;
                body.receiveShadow = true;
                group.add(body);

                const headGeo = new THREE.SphereGeometry(0.38, 16, 16);
                const headMat = new THREE.MeshStandardMaterial({
                    color: 0xff2d95,
                    roughness: 0.2,
                    metalness: 0.4,
                    emissive: 0x440011,
                    emissiveIntensity: 0.15,
                });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 1.9;
                head.castShadow = true;
                head.receiveShadow = true;
                group.add(head);

                const armMat = new THREE.MeshStandardMaterial({
                    color: 0x7b2ffc,
                    roughness: 0.4,
                    metalness: 0.3,
                });
                for (let side = -1; side <= 1; side += 2) {
                    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.9, 8), armMat);
                    arm.position.set(side * 0.8, 1.45, 0);
                    arm.rotation.z = side * 0.2;
                    arm.castShadow = true;
                    arm.receiveShadow = true;
                    group.add(arm);
                }

                const legMat = new THREE.MeshStandardMaterial({
                    color: 0x2a3a6a,
                    roughness: 0.5,
                    metalness: 0.1,
                });
                for (let side = -1; side <= 1; side += 2) {
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.8, 8), legMat);
                    leg.position.set(side * 0.22, 0.4, 0);
                    leg.castShadow = true;
                    leg.receiveShadow = true;
                    group.add(leg);
                }

                const ringGeo = new THREE.TorusGeometry(0.7, 0.03, 12, 24);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0x00b4ff,
                    emissive: 0x00b4ff,
                    emissiveIntensity: 0.6,
                    transparent: true,
                    opacity: 0.5,
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.y = 0.05;
                ring.rotation.x = Math.PI / 2;
                group.add(ring);

                scene.add(group);
                mannequin = group;
                modelLoaded = true;
            }

            // --- Load GLB model ---
            const loader = new THREE.GLTFLoader();
            const modelUrl = 'https://foldnite.github.io/assets/3D/creative-mannequin.glb';

            loader.load(
                modelUrl,
                function(gltf) {
                    mannequin = gltf.scene;
                    mannequin.scale.set(0.9, 0.9, 0.9);
                    mannequin.position.y = 0.0;
                    mannequin.rotation.y = 0;

                    mannequin.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                child.material.roughness = 0.4;
                                child.material.metalness = 0.1;
                            }
                        }
                    });

                    scene.add(mannequin);

                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(mannequin);
                        const clip = gltf.animations[0];
                        const action = mixer.clipAction(clip);
                        action.play();
                    }

                    modelLoaded = true;
                },
                undefined,
                function(error) {
                    console.warn('GLB failed to load, using fallback figure.', error);
                    createFallbackMannequin();
                }
            );

            // Timeout fallback
            setTimeout(function() {
                if (!modelLoaded) {
                    console.warn('GLB loading timeout, switching to fallback.');
                    createFallbackMannequin();
                }
            }, 5000);

            // --- Resize handler ---
            function resize() {
                const w = container.clientWidth;
                const h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            }
            window.addEventListener('resize', resize);
            window.addEventListener('orientationchange', function() {
                setTimeout(resize, 400);
            });
            resize();

            // --- Animation loop ---
            function animate() {
                requestAnimationFrame(animate);

                const delta = clock.getDelta();

                if (mannequin) {
                    mannequin.rotation.y += delta * 0.3;
                }

                if (mixer) {
                    mixer.update(delta);
                }

                renderer.render(scene, camera);
            }
            animate();

        })();
    </script>

</body>
</html>
