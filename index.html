<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOLDNITE – qFoldIT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Burbank Big Condensed';
            src: url('https://foldnite.github.io/assets/font/burbankbigcondensed_bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Burbank Big Condensed';
            src: url('https://foldnite.github.io/assets/font/burbankbigcondensed_black.otf') format('opentype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Burbank Big Condensed', 'Segoe UI', system-ui, sans-serif;
            background: #000;
        }

        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            display: block;
        }

        .header-text {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 10;
            color: #ffffff;
            font-family: 'Burbank Big Condensed', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            line-height: 1;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 0.15em;
            font-size: clamp(3.2rem, 6vw, 6rem);
        }

        .header-text .lego-icon {
            height: 1em;
            width: auto;
            display: block;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
        }

        .footer-text {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            color: #ffffff;
            font-family: 'Burbank Big Condensed', sans-serif;
            font-weight: 700;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.3px;
            pointer-events: none;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.3em;
            font-size: clamp(2rem, 3.5vw, 3.8rem);
        }

        .footer-text .fa-github {
            font-size: 0.9em;
            color: #ffffff;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
        }

        @media (max-width: 600px) {
            .header-text {
                top: 24px;
                left: 24px;
                font-size: clamp(3.5rem, 10vw, 5.5rem);
            }
            .header-text .lego-icon {
                height: 1.1em;
            }

            .footer-text {
                left: 0;
                right: 0;
                bottom: 20px;
                width: 100%;
                justify-content: center;
                text-align: center;
                gap: 0.3em;
                font-size: clamp(1.8rem, 5vw, 2.8rem);
                padding: 0 16px;
                background: transparent;
            }
            .footer-text .fa-github {
                font-size: 0.9em;
            }
        }

        @media (max-width: 400px) {
            .header-text {
                top: 16px;
                left: 16px;
                font-size: clamp(3rem, 12vw, 4.5rem);
            }
            .footer-text {
                bottom: 16px;
                font-size: clamp(1.6rem, 6vw, 2.4rem);
                padding: 0 12px;
            }
        }
    </style>
</head>
<body>
    <img class="hero-bg"
         src="https://foldnite.github.io/assets/img/Foldnite.png"
         alt="qFoldIT Quantum Poster" />

    <div class="header-text">
        <img class="lego-icon" src="https://qfoldit.github.io/assets/lego_brand.svg" alt="LEGO logo" loading="lazy" style="position: relative;top: -5px;">
        FOLDNITE
    </div>

    <div class="footer-text">
        <i class="fab fa-github" aria-hidden="true"></i>
        Pre-release v0.4.0
    </div>
</body>
</html>
