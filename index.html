<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortnite Science</title>

    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Three.js + extensions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js">
    </script>

    <style>
        @font-face {
            font-family: 'Burbank Big Condensed';
            src: url('https://foldnite.github.io/assets/font/burbankbigcondensed_bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Burbank Big Condensed';
            src: url('https://foldnite.github.io/assets/font/burbankbigcondensed_black.otf') format('opentype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        /* ---------- Reset ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Burbank Big Condensed', sans-serif;
            background: #0b0e1a;
            color: #fff;
            overflow: hidden;
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* ---------- Animated digital grid (grayscale background) ---------- */
        #grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(145deg, #1a1a1a 0%, #2a2a2a 50%, #151515 100%);
            overflow: hidden;
            pointer-events: none;
        }
        #grid-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            transform-origin: center center;
        }
        #grid-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 120px 120px;
            animation: gridMove 30s linear infinite reverse;
            transform-origin: center center;
        }
        @keyframes gridMove {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(60px, 60px) rotate(0.5deg);
            }
        }

        /* ---------- 3D container (full screen, no borders) ---------- */
        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        #three-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ---------- Main content (title at top) ---------- */
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 4vh 5vw 0;
            pointer-events: none;
        }

        .title-block {
            text-align: center;
            pointer-events: none;
            margin-top: 1vh;
        }
        .title-block h1 {
            font-family: 'Burbank Big Condensed', sans-serif;
            font-weight: 900;
            font-size: clamp(3rem, 12vw, 7rem);
            letter-spacing: 4px;
            line-height: 0.9;
            background: linear-gradient(135deg, #00b4ff 0%, #7b2ffc 50%, #ff2d95 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(0, 180, 255, 0.15);
        }
        .title-block .sub {
            font-family: 'Burbank Big Condensed', sans-serif;
            font-weight: 700;
            font-size: clamp(1.8rem, 6vw, 3.8rem);
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            margin-top: -0.3em;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        /* ---------- Menu button (top right) - icon only, no box-shadow ---------- */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 25px;
            z-index: 10;
            pointer-events: auto;
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            padding: 0.6rem 0.9rem;
            font-family: 'Burbank Big Condensed', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #fff;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-btn:hover {
            background: rgba(50, 50, 50, 0.85);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        .menu-btn i {
            font-size: 1.4rem;
            color: #aaa;
        }

        /* ---------- Modal overlay ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .modal-overlay.active {
            display: flex;
        }

        /* ---------- Modal panel (beveled) ---------- */
        .modal-panel {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0;
            clip-path: polygon(0% 0%, 100% 0%, 94% 100%, 6% 100%);
            padding: 2.5rem 3rem 2.5rem;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            pointer-events: auto;
        }
        .modal-panel::-webkit-scrollbar {
            width: 4px;
        }
        .modal-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s;
            font-family: 'Burbank Big Condensed', sans-serif;
            line-height: 1;
        }
        .modal-close:hover {
            color: #fff;
        }

        /* sections inside modal */
        .modal-panel .bottom-sections {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(1.5rem, 4vw, 3rem);
            margin-top: 0.5rem;
        }
        .modal-panel .section-group {
            flex: 0 1 auto;
            min-width: 180px;
            text-align: center;
            padding: 1.2rem 1.8rem 1.5rem;
            background: rgba(40, 40, 40, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            clip-path: polygon(0% 0%, 100% 0%, 94% 100%, 6% 100%);
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .modal-panel .section-group:hover {
            background: rgba(60, 60, 60, 0.7);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }
        .modal-panel .section-group .label {
            font-family: 'Burbank Big Condensed', sans-serif;
            font-weight: 700;
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            margin-bottom: 0.8rem;
            display: inline-block;
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 0.2rem;
        }
        .modal-panel .platform-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem 1.4rem;
        }
        .modal-panel .platform-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Burbank Big Condensed', sans-serif;
            font-weight: 700;
            font-size: clamp(0.9rem, 1.2vw, 1.2rem);
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1px;
            transition: color 0.2s;
            cursor: default;
            white-space: nowrap;
        }
        .modal-panel .platform-item i {
            font-size: clamp(1.2rem, 1.8vw, 1.6rem);
            color: #aaaaaa;
            opacity: 0.7;
            transition: opacity 0.2s, color 0.2s;
            width: 1.8rem;
            text-align: center;
        }
        .modal-panel .platform-item:hover {
            color: #fff;
        }
        .modal-panel .platform-item:hover i {
            opacity: 1;
            color: #ffffff;
        }

        /* ---------- GitHub link (bottom center) ---------- */
        .github-link {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.4);
            font-size: 2rem;
            transition: color 0.2s, transform 0.2s;
            pointer-events: auto;
            text-decoration: none;
        }
        .github-link:hover {
            color: #ffffff;
            transform: translateX(-50%) scale(1.1);
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 768px) {
            /* Make title block significantly larger on mobile */
            .title-block {
                margin-top: 2vh;  /* a bit more space */
            }
            .title-block h1 {
                font-size: clamp(4rem, 18vw, 9rem);  /* bigger */
                letter-spacing: 6px;
            }
            .title-block .sub {
                font-size: clamp(2.5rem, 8vw, 4.5rem);
                letter-spacing: 8px;
                margin-top: -0.2em;
            }
            .content {
                padding-top: 6vh;
            }

            .modal-panel {
                padding: 1.8rem 1.5rem 2rem;
                clip-path: polygon(0% 0%, 100% 0%, 96% 100%, 4% 100%);
                width: 95%;
            }
            .modal-panel .bottom-sections {
                flex-direction: column;
                align-items: center;
                gap: 1.2rem;
            }
            .modal-panel .section-group {
                min-width: unset;
                width: 100%;
                max-width: 300px;
                padding: 1rem 1rem 1.2rem;
                clip-path: polygon(0% 0%, 100% 0%, 96% 100%, 4% 100%);
            }
            .modal-panel .platform-item {
                white-space: normal;
                font-size: 0.95rem;
            }
            .menu-btn {
                padding: 0.4rem 0.7rem;
                right: 15px;
                top: 15px;
            }
            .menu-btn i {
                font-size: 1.2rem;
            }
            .github-link {
                font-size: 1.6rem;
                bottom: 18px;
            }
        }

        @media (max-width: 480px) {
            .title-block h1 {
                font-size: clamp(3.8rem, 20vw, 8rem);
                letter-spacing: 4px;
            }
            .title-block .sub {
                font-size: clamp(2.2rem, 9vw, 4rem);
                letter-spacing: 6px;
            }
            .content {
                padding-top: 5vh;
            }

            .modal-panel {
                padding: 1.2rem 0.8rem 1.5rem;
                clip-path: polygon(0% 0%, 100% 0%, 97% 100%, 3% 100%);
            }
            .modal-panel .section-group {
                padding: 0.8rem 0.6rem 1rem;
                clip-path: polygon(0% 0%, 100% 0%, 97% 100%, 3% 100%);
            }
            .modal-panel .platform-item {
                font-size: 0.85rem;
                gap: 0.2rem;
            }
            .modal-panel .platform-item i {
                font-size: 1rem;
                width: 1.4rem;
            }
            .menu-btn {
                padding: 0.3rem 0.5rem;
                right: 10px;
                top: 10px;
            }
            .menu-btn i {
                font-size: 1.1rem;
            }
            .github-link {
                font-size: 1.4rem;
                bottom: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Animated grid background (grayscale) -->
    <div id="grid-bg"></div>

    <!-- 3D container -->
    <div id="three-container">
        <canvas id="three-canvas"></canvas>
    </div>

    <!-- Menu button (top right) – icon only, no shadow -->
    <button class="menu-btn" id="menuBtn" aria-label="Menu">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Modal overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-panel">
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>

            <div class="bottom-sections">

                <!-- PLAY section -->
                <div class="section-group">
                    <div class="label"><i class="fas fa-gamepad" style="margin-right:0.5rem;color:#aaaaaa;"></i>PLAY</div>
                    <div class="platform-list">
                        <span class="platform-item"><i class="fab fa-amazon"></i> Amazon Luna</span>
                        <span class="platform-item"><i class="fab fa-xbox"></i> Xbox Cloud</span>
                        <span class="platform-item"><i class="fas fa-bolt"></i> GeForce NOW</span>
                    </div>
                </div>

                <!-- DOWNLOAD ON section -->
                <div class="section-group">
                    <div class="label"><i class="fas fa-download" style="margin-right:0.5rem;color:#aaaaaa;"></i>DOWNLOAD ON</div>
                    <div class="platform-list">
                        <span class="platform-item"><i class="fab fa-playstation"></i> PlayStation</span>
                        <span class="platform-item"><i class="fab fa-xbox"></i> Xbox</span>
                        <span class="platform-item"><i class="fab fa-nintendo-switch"></i> Nintendo</span>
                        <span class="platform-item"><i class="fab fa-android"></i> Android</span>
                        <span class="platform-item"><i class="fab fa-epicgames"></i> Epic Games</span>
                        <span class="platform-item"><i class="fab fa-apple"></i> iOS / iPad</span>
                        <span class="platform-item"><i class="fab fa-google-play"></i> Google Play</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Main content – title at top -->
    <div class="content">
        <div class="title-block">
            <h1>FORTNITE</h1>
            <div class="sub">SCIENCE</div>
        </div>
    </div>

    <!-- GitHub link (bottom center) -->
    <a href="https://github.com/qfoldit" target="_blank" class="github-link" aria-label="GitHub">
        <i class="fab fa-github"></i>
    </a>

    <!-- ============================================================ -->
    <!-- Three.js – load and display the mannequin                     -->
    <!-- ============================================================ -->
    <script>
        (function() {
            const container = document.getElementById('three-container');
            const canvas = document.getElementById('three-canvas');

            // --- Scene ---
            const scene = new THREE.Scene();
            scene.background = null; // transparent

            // --- Camera ---
            const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 1.8, 4.2);
            camera.lookAt(0, 1.2, 0);

            // --- Renderer ---
            const renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true,
                antialias: true,
            });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;

            // --- Lighting ---
            const ambient = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambient);

            const key = new THREE.DirectionalLight(0xffffff, 1.8);
            key.position.set(3, 5, 4);
            key.castShadow = true;
            key.shadow.mapSize.width = 1024;
            key.shadow.mapSize.height = 1024;
            scene.add(key);

            const fill = new THREE.DirectionalLight(0xcccccc, 0.8);
            fill.position.set(-3, 2, 2);
            scene.add(fill);

            const rim = new THREE.DirectionalLight(0x888888, 0.6);
            rim.position.set(0, -1, -5);
            scene.add(rim);

            const back = new THREE.DirectionalLight(0x666666, 0.4);
            back.position.set(-2, 1, -4);
            scene.add(back);

            const hemi = new THREE.HemisphereLight(0xaaaaaa, 0x444444, 0.4);
            scene.add(hemi);

            // --- Invisible ground plane for shadows ---
            const planeGeo = new THREE.PlaneGeometry(8, 8);
            const planeMat = new THREE.ShadowMaterial({
                opacity: 0.25,
                color: 0x000000,
            });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = -0.1;
            plane.receiveShadow = true;
            scene.add(plane);

            // --- Variables ---
            let mannequin = null;
            let mixer = null;
            let clock = new THREE.Clock();
            let modelLoaded = false;

            // --- Fallback figure ---
            function createFallbackMannequin() {
                const group = new THREE.Group();

                const bodyGeo = new THREE.CylinderGeometry(0.6, 0.7, 1.8, 12);
                const bodyMat = new THREE.MeshStandardMaterial({
                    color: 0x888888,
                    roughness: 0.4,
                    metalness: 0.5,
                    emissive: 0x222222,
                    emissiveIntensity: 0.2,
                });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.9;
                body.castShadow = true;
                body.receiveShadow = true;
                group.add(body);

                const headGeo = new THREE.SphereGeometry(0.38, 16, 16);
                const headMat = new THREE.MeshStandardMaterial({
                    color: 0xaaaaaa,
                    roughness: 0.3,
                    metalness: 0.3,
                    emissive: 0x333333,
                    emissiveIntensity: 0.1,
                });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 1.9;
                head.castShadow = true;
                head.receiveShadow = true;
                group.add(head);

                const armMat = new THREE.MeshStandardMaterial({
                    color: 0x999999,
                    roughness: 0.4,
                    metalness: 0.3,
                });
                for (let side = -1; side <= 1; side += 2) {
                    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.9, 8), armMat);
                    arm.position.set(side * 0.8, 1.45, 0);
                    arm.rotation.z = side * 0.2;
                    arm.castShadow = true;
                    arm.receiveShadow = true;
                    group.add(arm);
                }

                const legMat = new THREE.MeshStandardMaterial({
                    color: 0x666666,
                    roughness: 0.5,
                    metalness: 0.1,
                });
                for (let side = -1; side <= 1; side += 2) {
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.8, 8), legMat);
                    leg.position.set(side * 0.22, 0.4, 0);
                    leg.castShadow = true;
                    leg.receiveShadow = true;
                    group.add(leg);
                }

                const ringGeo = new THREE.TorusGeometry(0.7, 0.03, 12, 24);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0xaaaaaa,
                    emissive: 0x444444,
                    emissiveIntensity: 0.4,
                    transparent: true,
                    opacity: 0.5,
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.y = 0.05;
                ring.rotation.x = Math.PI / 2;
                group.add(ring);

                scene.add(group);
                mannequin = group;
                modelLoaded = true;
            }

            // --- Load GLB model ---
            const loader = new THREE.GLTFLoader();
            const modelUrl = 'https://foldnite.github.io/assets/3D/creative-mannequin.glb';

            loader.load(
                modelUrl,
                function(gltf) {
                    mannequin = gltf.scene;
                    mannequin.scale.set(0.9, 0.9, 0.9);
                    mannequin.position.y = 0.0;
                    mannequin.rotation.y = 0;

                    mannequin.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                child.material.roughness = 0.4;
                                child.material.metalness = 0.1;
                            }
                        }
                    });

                    scene.add(mannequin);

                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(mannequin);
                        const clip = gltf.animations[0];
                        const action = mixer.clipAction(clip);
                        action.play();
                    }

                    modelLoaded = true;
                },
                undefined,
                function(error) {
                    console.warn('GLB failed to load, using fallback figure.', error);
                    createFallbackMannequin();
                }
            );

            // Timeout fallback
            setTimeout(function() {
                if (!modelLoaded) {
                    console.warn('GLB loading timeout, switching to fallback.');
                    createFallbackMannequin();
                }
            }, 5000);

            // --- Resize handler ---
            function resize() {
                const w = container.clientWidth;
                const h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            }
            window.addEventListener('resize', resize);
            window.addEventListener('orientationchange', function() {
                setTimeout(resize, 400);
            });
            resize();

            // --- Animation loop ---
            function animate() {
                requestAnimationFrame(animate);

                const delta = clock.getDelta();

                if (mannequin) {
                    mannequin.rotation.y += delta * 0.3;
                }

                if (mixer) {
                    mixer.update(delta);
                }

                renderer.render(scene, camera);
            }
            animate();

        })();
    </script>

    <!-- ============================================================ -->
    <!-- Modal logic (vanilla JS)                                      -->
    <!-- ============================================================ -->
    <script>
        (function() {
            const menuBtn = document.getElementById('menuBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalClose = document.getElementById('modalClose');

            // Open modal
            menuBtn.addEventListener('click', function() {
                modalOverlay.classList.add('active');
            });

            // Close modal (X button)
            modalClose.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
            });

            // Close modal on overlay click (outside panel)
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    modalOverlay.classList.remove('active');
                }
            });

            // Close modal on Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    modalOverlay.classList.remove('active');
                }
            });
        })();
    </script>

</body>
</html>
